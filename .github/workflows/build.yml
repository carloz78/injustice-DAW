name: Compilar INJUSTICE DAW
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --config Release --target EngineProbe
      - name: Prueba del motor (sin interfaz)
        run: ./build/tools/engine_probe/EngineProbe_artefacts/Release/EngineProbe.exe
